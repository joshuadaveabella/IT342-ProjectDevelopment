spring.application.name=dila-dila
server.port=8080

# ---- Database (PostgreSQL). Override with environment variables; never commit real passwords. ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dila_dila}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates the "users" table from the entity on startup (see database/schema.sql for the equivalent SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Session cookie (server-side session; the browser only holds an opaque id) ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set COOKIE_SECURE=true when the site is served over HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- CORS (only needed if the React app calls the API directly instead of through the Vite proxy) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
